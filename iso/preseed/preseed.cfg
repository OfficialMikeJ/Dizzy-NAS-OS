#_preseed_V1
# DizzyOS unattended Debian installer (kickstart-style preseed)

# Localization
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

# Network + hostname
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string dizzyos
d-i netcfg/get_domain string local
d-i netcfg/hostname string dizzyos

# Mirror (netinst pulls packages over the network)
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# Users — root disabled; admin is dizzy (default password: dizzyos — change it!)
d-i passwd/root-login boolean false
d-i passwd/user-fullname string DizzyOS Admin
d-i passwd/username string dizzy
d-i passwd/user-password-crypted password $6$lDc2.o4rZdTxv/NH$A/gTDKWt1suIiRJivUPFT5g4Vfgz/jNQ1v4nkPz9zcGeiX.5U0ccg100c1UN9hlNF/8HVW7.nR1YhXtLyrRF80

# Clock
d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean true

# Partitioning: install the OS on the SMALLEST disk so the big drives
# stay untouched for the MergerFS/SnapRAID pool.
d-i partman/early_command string \
    SMALLEST=$(for d in $(list-devices disk); do echo "$(blockdev --getsize64 $d) $d"; done | sort -n | head -n1 | cut -d' ' -f2); \
    debconf-set partman-auto/disk "$SMALLEST"; \
    debconf-set grub-installer/bootdev "$SMALLEST"
d-i partman-auto/method string lvm
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-auto-lvm/guided_size string max
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Apt: network mirror only. Leaving the CD as a source makes apt inside the
# installer chroot fail (exit 100) once the medium is no longer mounted.
d-i apt-setup/disable-cdrom-entries boolean true
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
d-i apt-setup/use_mirror boolean true
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/contrib boolean true

# Packages
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string curl ca-certificates
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

# Bootloader
d-i grub-installer/only_debian boolean true

# Payload: copy DizzyOS off the ISO and arm the first-boot installer.
# NOTE: no apt work happens here on purpose — apt inside the d-i chroot is
# unreliable (CD source, partial network). The firstboot service does it all
# once the real system is up. Every step is `|| true` so a payload problem can
# never abort the OS install.
d-i preseed/late_command string \
    (mkdir -p /target/opt/dizzyos && \
     cp -r /cdrom/dizzyos/. /target/opt/dizzyos/ && \
     chmod +x /target/opt/dizzyos/install-dizzyos.sh && \
     cp /target/opt/dizzyos/dizzyos-firstboot.service /target/etc/systemd/system/ && \
     in-target systemctl enable dizzyos-firstboot.service) || true

d-i finish-install/reboot_in_progress note
